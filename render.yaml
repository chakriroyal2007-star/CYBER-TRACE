# Deployment configuration, not evidence that a service has been deployed.
# Import this Blueprint from an authorized repository in a Render account.
services:
  - type: web
    name: crypto-trace-india
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    disk:
      name: crypto-trace-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: DB_PATH
        value: /app/data/cryptotrace.sqlite
      - key: PYTHON_BIN
        value: /usr/bin/python3
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: MAX_DEMO_SESSIONS
        value: "1000"
